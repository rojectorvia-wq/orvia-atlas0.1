name: ORVIA Preview checks

on:
  push:
    branches:
      - orvia-0.2-nebula
      - orvia-0.4-autonomia-preview
      - orvia-0.5-autopiloto
      - orvia-0.6-impulso
  pull_request:
    branches:
      - orvia-0.2-nebula
      - orvia-0.4-autonomia-preview
      - orvia-0.5-autopiloto
      - orvia-0.6-impulso

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run syntax checks and unit tests
        run: npm run check
