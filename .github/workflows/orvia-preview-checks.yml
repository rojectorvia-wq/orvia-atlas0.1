name: ORVIA Preview checks

on:
  push:
    branches:
      - orvia-0.2-nebula
      - orvia-0.4-autonomia-preview
      - orvia-0.5-autopiloto
      - orvia-0.6-impulso
  pull_request:
    branches:
      - orvia-0.2-nebula
      - orvia-0.4-autonomia-preview
      - orvia-0.5-autopiloto
      - orvia-0.6-impulso

# Least privilege: validation needs to read source only.
permissions:
  contents: read

concurrency:
  group: orvia-preview-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run syntax checks and unit tests
        run: npm run check
